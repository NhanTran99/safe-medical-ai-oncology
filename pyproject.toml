[project]
name = "safe-medical-ai-oncology-dev"
version = "0.1.0"
description = "Phase 5 implementation scaffolding for the Safe Medical AI Oncology system (Task #002)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["08_Development/implementation/src/safe_medical_ai"]

[tool.pytest.ini_options]
testpaths = ["08_Development/implementation/tests"]
pythonpath = ["08_Development/implementation/src"]
